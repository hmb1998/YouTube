app = "youtube-4e39xg"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# ئەم بەشە زۆر گرنگە بۆ ئەوەی Fly.io نەبێتە هۆی کوژاندنەوەی بۆتەکە
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/"
  port = 8080
  timeout = "5s"
